<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一覧の見出し</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="list-row.css">
<link rel="stylesheet" href="list-header.css">
<script src="../theme.js"></script>
</head>
<body>
<header class="ds-page-header">
  <h1 class="ds-page-title">一覧の見出し</h1>
  <p class="ds-page-lead">仕様: design-system/components/list-header.md</p>
</header>
<main class="ds-page" data-group="一覧と面" data-height="300">
  <section class="ds-example">
    <h2 class="ds-example-title">見出しと右の補足</h2>
    <div class="ds-stack ds-list-section">
      <div class="ds-list-header" data-testid="recent-header"><h3 class="ds-list-header-title">最近の項目</h3><span class="ds-list-header-detail">12 件</span></div>
      <ul class="ds-list" role="list">
        <li><div class="ds-list-row"><span class="ds-list-row-text"><span class="ds-list-row-title">買い物のメモ</span><span class="ds-list-row-detail">きのう</span></span></div></li>
        <li><div class="ds-list-row"><span class="ds-list-row-text"><span class="ds-list-row-title">旅行の計画</span><span class="ds-list-row-detail">3 日前</span></span></div></li>
      </ul>
    </div>
  </section>
</main>
</body>
</html>
