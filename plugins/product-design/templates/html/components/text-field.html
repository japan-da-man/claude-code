<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1 行の入力</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="text-field.css">
<script src="../theme.js"></script>
</head>
<body>
<header class="ds-page-header">
  <h1 class="ds-page-title">1 行の入力</h1>
  <p class="ds-page-lead">仕様: design-system/components/text-field.md</p>
</header>
<main class="ds-page" data-group="入力" data-height="600">
  <section class="ds-example">
    <h2 class="ds-example-title">枠つき（一覧の外）</h2>
    <div class="ds-stack">
      <div class="ds-field ds-field--bordered">
        <label class="ds-field-label" for="tf-name">名前</label>
        <input class="ds-field-input" id="tf-name" type="text" placeholder="山田 花子" aria-describedby="tf-name-message" data-testid="name-field">
        <p class="ds-field-message" id="tf-name-message">あとから変えられます</p>
      </div>
    </div>
  </section>
  <section class="ds-example">
    <h2 class="ds-example-title">枠なし（一覧の中）</h2>
    <div class="ds-stack">
      <div class="ds-field-list">
        <div class="ds-field ds-field--plain">
          <label class="ds-visually-hidden" for="tf-title">題名</label>
          <input class="ds-field-input" id="tf-title" type="text" placeholder="題名">
        </div>
        <div class="ds-field ds-field--plain">
          <label class="ds-visually-hidden" for="tf-place">場所</label>
          <input class="ds-field-input" id="tf-place" type="text" value="東京">
        </div>
      </div>
    </div>
  </section>
  <section class="ds-example">
    <h2 class="ds-example-title">状態（入力中・エラー・押せない）</h2>
    <div class="ds-stack">
      <div class="ds-field ds-field--bordered">
        <label class="ds-field-label" for="tf-mail">メールアドレス</label>
        <input class="ds-field-input" id="tf-mail" type="email" value="hanako@" data-state="focused">
      </div>
      <div class="ds-field ds-field--bordered">
        <label class="ds-field-label" for="tf-mail-error">メールアドレス</label>
        <input class="ds-field-input" id="tf-mail-error" type="email" value="hanako@" aria-invalid="true" aria-describedby="tf-mail-error-message">
        <p class="ds-field-message" id="tf-mail-error-message">メールアドレスの形になっていません。@ のあとも入れてください</p>
      </div>
      <div class="ds-field ds-field--bordered">
        <label class="ds-field-label" for="tf-id">会員番号</label>
        <input class="ds-field-input" id="tf-id" type="text" value="0012345" disabled>
      </div>
    </div>
  </section>
</main>
</body>
</html>
