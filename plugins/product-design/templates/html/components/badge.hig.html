<!doctype html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>印</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="badge.css">
<script src="../theme.js"></script>
</head>
<body>
<header class="ds-page-header">
  <h1 class="ds-page-title">印</h1>
  <p class="ds-page-lead">仕様: design-system/components/badge.md</p>
</header>
<main class="ds-page" data-group="一覧と面" data-height="160">
  <section class="ds-example">
    <h2 class="ds-example-title">種類（ふつう・主な色・エラー・成功・注意・お知らせ）</h2>
    <div class="ds-row">
      <span class="ds-badge ds-badge--neutral" data-testid="draft-badge">下書き</span>
      <span class="ds-badge ds-badge--accent">3</span>
      <span class="ds-badge ds-badge--error">期限切れ</span>
      <span class="ds-badge ds-badge--success">完了</span>
      <span class="ds-badge ds-badge--warning">まもなく</span>
