<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一覧の行</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="list-row.css">
<script src="../theme.js"></script>
</head>
<body>
<header class="ds-page-header">
  <h1 class="ds-page-title">一覧の行</h1>
  <p class="ds-page-lead">仕様: design-system/components/list-row.md</p>
</header>
<main class="ds-page" data-group="一覧と面" data-height="420">
  <section class="ds-example">
    <h2 class="ds-example-title">種類（矢印あり・値つき・なし）と、押している</h2>
    <div class="ds-stack">
      <ul class="ds-list" role="list">
        <li><a class="ds-list-row" href="#profile" data-testid="profile-row"><span class="ds-list-row-icon"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span class="ds-list-row-text"><span class="ds-list-row-title">プロフィール</span><span class="ds-list-row-detail">名前とアイコン</span></span><svg class="ds-icon ds-list-row-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a></li>
        <li><a class="ds-list-row" href="#notifications" data-state="pressed"><span class="ds-list-row-icon"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></span><span class="ds-list-row-text"><span class="ds-list-row-title">通知</span></span><span class="ds-list-row-value">オン</span><svg class="ds-icon ds-list-row-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></a></li>
        <li><div class="ds-list-row"><span class="ds-list-row-text"><span class="ds-list-row-title">版</span></span><span class="ds-list-row-value">1.4.0</span></div></li>
      </ul>
    </div>
  </section>
  <section class="ds-example">
    <h2 class="ds-example-title">選んでいる</h2>
    <div class="ds-stack">
      <ul class="ds-list" role="listbox" aria-label="言語">
        <li class="ds-list-row" role="option" aria-selected="true"><span class="ds-list-row-text"><span class="ds-list-row-title">日本語</span></span><svg class="ds-icon ds-list-row-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></li>
        <li class="ds-list-row" role="option" aria-selected="false"><span class="ds-list-row-text"><span class="ds-list-row-title">English</span></span><svg class="ds-icon ds-list-row-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></li>
      </ul>
    </div>
  </section>
</main>
</body>
</html>
