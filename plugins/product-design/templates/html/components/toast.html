<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トースト</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="toast.css">
<script src="../theme.js"></script>
</head>
<body>
<header class="ds-page-header">
  <h1 class="ds-page-title">トースト</h1>
  <p class="ds-page-lead">仕様: design-system/components/toast.md</p>
</header>
<main class="ds-page" data-group="メッセージ" data-height="300">
  <section class="ds-example">
    <h2 class="ds-example-title">種類（成功・お知らせ）と、取り消す操作</h2>
    <div class="ds-stack">
      <div class="ds-toast-stage">
        <div class="ds-toast ds-toast--success" role="status" data-testid="deleted-toast"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg><span class="ds-toast-text">メモを削除しました</span><button class="ds-toast-action" type="button">取り消す</button></div>
        <div class="ds-toast ds-toast--info" role="status"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span class="ds-toast-text">オフラインです。つながったら送ります</span></div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
