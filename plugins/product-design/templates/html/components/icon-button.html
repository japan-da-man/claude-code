<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アイコンのボタン</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="icon-button.css">
<script src="../theme.js"></script>
</head>
<body>
<header class="ds-page-header">
  <h1 class="ds-page-title">アイコンのボタン</h1>
  <p class="ds-page-lead">仕様: design-system/components/icon-button.md</p>
</header>
<main class="ds-page" data-group="操作" data-height="220">
  <section class="ds-example">
    <h2 class="ds-example-title">種類（主な色・目立たせない色）</h2>
    <div class="ds-row">
      <button class="ds-icon-button ds-icon-button--accent" type="button" aria-label="追加する" data-testid="add-button"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ds-icon-button ds-icon-button--muted" type="button" aria-label="閉じる"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
  </section>
  <section class="ds-example">
    <h2 class="ds-example-title">状態（ふつう・押している・押せない）</h2>
    <div class="ds-row">
      <button class="ds-icon-button ds-icon-button--accent" type="button" aria-label="削除する"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
      <button class="ds-icon-button ds-icon-button--accent" type="button" aria-label="削除する" data-state="pressed"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
      <button class="ds-icon-button ds-icon-button--accent" type="button" aria-label="削除する" disabled><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
    </div>
  </section>
</main>
</body>
</html>
