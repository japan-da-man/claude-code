<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>読み込み中</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="loading.css">
<script src="../theme.js"></script>
</head>
<body>
<header class="ds-page-header">
  <h1 class="ds-page-title">読み込み中</h1>
  <p class="ds-page-lead">仕様: design-system/components/loading.md</p>
</header>
<main class="ds-page" data-group="状態" data-height="200">
  <section class="ds-example">
    <h2 class="ds-example-title">回る印と短い文（文は任意）</h2>
    <div class="ds-row">
      <div class="ds-loading" role="status" data-testid="list-loading"><span class="ds-loading-spinner" aria-hidden="true"></span><span class="ds-loading-text">読み込んでいます</span></div>
      <div class="ds-loading" role="status"><span class="ds-loading-spinner" aria-hidden="true"></span><span class="ds-visually-hidden">読み込んでいます</span></div>
    </div>
  </section>
</main>
</body>
</html>
